spring:
  application:
    name: product-activation
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:activation;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
provider:
  base-url: ${PROVIDER_BASE_URL:http://localhost:8081}
  connect-timeout: ${PROVIDER_CONNECT_TIMEOUT:1s}
  request-timeout: ${PROVIDER_REQUEST_TIMEOUT:2s}
springdoc:
  paths-to-match: /api/v1/requests/**
  override-with-generic-response: false
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: method
